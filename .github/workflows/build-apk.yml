
name: Build Legend TV Parts Vault APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'legend_tv_parts_vault_android_inventory_5.3.0_gallery_ai_search.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project ZIP
        run: |
          test -f legend_tv_parts_vault_android_inventory_5.3.0_gallery_ai_search.zip
          unzip -t legend_tv_parts_vault_android_inventory_5.3.0_gallery_ai_search.zip

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q legend_tv_parts_vault_android_inventory_5.3.0_gallery_ai_search.zip -d project

      - name: Verify app version
        working-directory: project
        run: |
          grep -F "versionName '5.3.0'" app/build.gradle
          test -f settings.gradle
          test -f build.gradle

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug
      - name: Verify APK manifest version
     working-directory: project
     run: |
       APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
       test -n "$APK"
       AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
       test -n "$AAPT"
       "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
       grep -F "package: name='com.legendtvparts.repairvault' versionCode='32' versionName='5.3.0'" /tmp/apk-badging.txt
     -name: Upload APK
    uses: actions/upload-artifact@v4
    with:
     name: legend-tv-parts-vault-5.3.0-gallery-ai-search-apk
    path: project/app/build/outputs/apk/debug/*.apk
   if-no-files-found: error

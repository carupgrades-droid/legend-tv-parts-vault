
name: Build Legend TV Parts Vault 5.2.0

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract 5.2.0 project
        run: |
          set -euo pipefail
          test -f legend_tv_parts_vault_android_inventory_5.2.0_cloud_ai_workspace.zip
          unzip -o legend_tv_parts_vault_android_inventory_5.2.0_cloud_ai_workspace.zip -d .
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/tv_repair_knowledge_vault_offline.html
          grep -F "versionName '5.2.0'" app/build.gradle
          grep -F "versionCode 31" app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Upload 5.2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: legend-tv-parts-vault-5.2.0-cloud-ai-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
